name: Build Windows CUDA DLLs and Binaries

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-windows-cuda-shared:
    runs-on: windows-2022 # Pin explicitly to windows-2022 to guarantee Visual Studio 2022 availability
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive



      - name: Apply Patches (GNU Patch + Auto Fuzz)
        id: patching
        shell: bash
        run: |
          set -uo pipefail
      
          mkdir -p patch-logs
          REPORT="patch-report.md"
          MANIFEST=".patch-applied"
          
          touch "$MANIFEST"
          : > "$REPORT"
      
          total=0
          applied=0
          already=0
          failed=0
      
          echo "## Patch Application Report" >> "$REPORT"
      
          echo "Git: $(git --version)"
          echo "Patch: $(patch --version | head -n 1)"
      
          shopt -s nullglob nocaseglob
          patches=(Patches/*.patch patch/*.patch)
          shopt -u nullglob nocaseglob
      
          total=${#patches[@]}
          echo "Found $total patch(es)."
      
          for p in "${patches[@]}"; do
            filename=$(basename "$p")
            log="patch-logs/${filename}.log"
            hash=$(sha256sum "$p" | awk '{print $1}')
      
            : > "$log"
      
            echo ""
            echo "========================================"
            echo "PATCH: $p"
            echo "========================================"
      
            echo "### $p" >> "$REPORT"
      
            # Git is used for statistics only.
            git apply --stat "$p" 2>&1 || true
      
            # Reliable duplicate detection when the manifest persists.
            if grep -Fqx "$hash" "$MANIFEST"; then
              echo "ALREADY APPLIED: SHA256 recorded."
              already=$((already + 1))
              echo "- ALREADY APPLIED (manifest)" >> "$REPORT"
              continue
            fi
      
            # Test normal forward application, starting with zero fuzz.
            success=0
            selected_fuzz=0
      
            echo "Testing patch..."
      
            for fuzz in 0 1 2 3 4; do
              echo "Trying fuzz=$fuzz..."
      
              if patch --dry-run --batch --forward --fuzz="$fuzz" -p1 -i "$p" > "$log" 2>&1; then
                success=1
                selected_fuzz=$fuzz
                break
              fi
            done
      
            # If forward application fails, test exact reverse application.
            if [ "$success" -eq 0 ]; then
              echo "Checking reverse application..."
      
              if patch --dry-run --batch --reverse --fuzz=0 -p1 -i "$p" > "$log" 2>&1; then
                echo "ALREADY APPLIED (exact reverse check)."
                already=$((already + 1))
                echo "- ALREADY APPLIED (reverse check)" >> "$REPORT"
                echo "$hash" >> "$MANIFEST"
                continue
              fi
      
              echo "FAILED: Cannot apply patch."
              failed=$((failed + 1))
              echo "- FAILED" >> "$REPORT"
              continue
            fi
      
            # Apply using the minimum successful fuzz level.
            echo "Applying with fuzz=$selected_fuzz..."
      
            if patch --batch --forward --fuzz="$selected_fuzz" -p1 -i "$p" >> "$log" 2>&1; then
              echo "SUCCESS."
              applied=$((applied + 1))
              echo "- APPLIED (fuzz=$selected_fuzz)" >> "$REPORT"
              echo "$hash" >> "$MANIFEST"
            else
              echo "FAILED DURING APPLICATION."
              failed=$((failed + 1))
              echo "- FAILED DURING APPLICATION" >> "$REPORT"
            fi
      
            echo "Log: $log"
          done
      
          echo ""
          echo "========================================"
          echo "PATCH SUMMARY"
          echo "========================================"
          echo "Total:   $total"
          echo "Applied: $applied"
          echo "Already: $already"
          echo "Failed:  $failed"
      
          git status --short || true
      
          {
            echo ""
            echo "## Summary"
            echo ""
            echo "| Result | Count |"
            echo "|---|---:|"
            echo "| Total | $total |"
            echo "| Applied | $applied |"
            echo "| Already applied | $already |"
            echo "| Failed | $failed |"
          } >> "$REPORT"
      
          {
            echo "## Patch processing"
            echo ""
            echo "- Total: $total"
            echo "- Applied: $applied"
            echo "- Already applied: $already"
            echo "- Failed: $failed"
          } >> "$GITHUB_STEP_SUMMARY"
      
          echo "PATCH_TOTAL=$total" >> "$GITHUB_OUTPUT"
          echo "PATCH_APPLIED=$applied" >> "$GITHUB_OUTPUT"
          echo "PATCH_ALREADY=$already" >> "$GITHUB_OUTPUT"
          echo "PATCH_FAILED=$failed" >> "$GITHUB_OUTPUT"
      
          echo "Patch processing completed."

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: '12.4.0'

      - name: Initialize MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1 # Sets up required environment variables and compiler paths for MSVC

      - name: Configure CMake for Windows CUDA Shared Libraries
        shell: pwsh
        run: |
          mkdir build
          cd build
          
          # CMake will now automatically detect MSVC and the CUDA toolkit via environment variables
          cmake .. `
            -DGGML_CUDA=ON `
            -DGGML_NATIVE=OFF `
            -DGGML_BACKEND_DL=ON `
            -DGGML_CPU_ALL_VARIANTS=ON `
            -DGGML_AVX512=OFF `
            -DGGML_AVX512_VBMI=OFF `
            -DGGML_AVX512_VNNI=OFF `
            -DGGML_AVX512_BF16=OFF `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Everything
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Bundle DLLs, EXEs, and NVIDIA Runtimes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path final-release
          Get-ChildItem -Path build -Recurse -Filter "*.exe" | Copy-Item -Destination final-release -Force
          Get-ChildItem -Path build -Recurse -Filter "*.dll" | Copy-Item -Destination final-release -Force

      - name: Upload Windows Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-windows-cuda-shared-dlls
          path: final-release/*
