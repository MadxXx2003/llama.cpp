name: Build Windows CUDA DLLs and Binaries

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-windows-cuda-shared:
    runs-on: windows-2022 # Pin explicitly to windows-2022 to guarantee Visual Studio 2022 availability
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive


      - name: Configure Git Identity & Apply Patches (Verbose Diagnostics)
        id: patching
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p patch-logs
          REPORT="patch-report.md"
          : > "$REPORT"

          git config user.name "GitHub Action Runner"
          git config user.email "runner@actions.local"

          echo "=================================================="
          echo "       VERBOSE PATCH APPLICATION SYSTEM"
          echo "=================================================="

          echo "Repository: $(git rev-parse --show-toplevel)"
          echo "Branch:     $(git branch --show-current)"
          echo "Commit:     $(git rev-parse HEAD)"
          echo "Git:        $(git --version)"
          echo ""

          echo "## Patch Application Report" >> "$REPORT"
          echo "" >> "$REPORT"
          echo "- Base commit: $(git rev-parse HEAD)" >> "$REPORT"
          echo "- Branch: $(git branch --show-current)" >> "$REPORT"
          echo "" >> "$REPORT"

          echo "Initial working tree:"
          git status --short

          shopt -s nullglob nocaseglob
          patches=(Patches/*.patch patch/*.patch)
          shopt -u nullglob nocaseglob

          total=${#patches[@]}
          applied=0
          already=0
          failed=0

          echo ""
          echo "Discovered $total patch file(s)."
          echo ""

          if [ "$total" -eq 0 ]; then
            echo "No patch files found."
            echo "No patches were available." >> "$REPORT"
          fi

          run_cmd() {
            local description="$1"
            shift

            local tmp="${log}.attempt"

            echo ""
            echo ">>> $description"
            printf 'COMMAND:'
            printf ' %q' "$@"
            echo ""

            "$@" > "$tmp" 2>&1
            local rc=$?

            if [ -s "$tmp" ]; then
              cat "$tmp" | tee -a "$log"
            fi

            rm -f "$tmp"

            echo "Exit code: $rc"
            echo "Exit code: $rc" >> "$log"

            return "$rc"
          }

          for p in "${patches[@]}"; do
            index=$((index + 1))
            index=${index:-1}

            filename=$(basename "$p")
            log="patch-logs/$(printf '%03d' "$index")-${filename}.log"

            : > "$log"

            echo ""
            echo "=================================================="
            echo "PATCH [$index/$total]: $p"
            echo "=================================================="

            {
              echo "# Patch: $p"
              echo "Date: $(date -u)"
              echo "Commit: $(git rev-parse HEAD)"
            } >> "$log"

            {
              echo "### $p"
            } >> "$REPORT"

            echo ""
            echo "[1/5] Inspecting patch..."

            if ! run_cmd "Patch statistics" git apply --stat "$p"; then
              echo "WARNING: Could not read patch statistics."
            fi

            run_cmd "Patch summary" git apply --summary "$p" || true

            echo ""
            echo "[2/5] Checking whether patch is already applied..."

            if run_cmd "Reverse application check" git apply --reverse --check "$p"; then
              echo "NOTICE: Patch already applied. Skipping."
              already=$((already + 1))
              echo "- STATUS: ALREADY APPLIED" >> "$REPORT"
              continue
            fi

            echo ""
            echo "[3/5] Attempting three-way application..."

            if run_cmd "Three-way validation" git apply --check --3way "$p"; then

              if run_cmd "Applying three-way patch" git apply --verbose --3way "$p"; then
                echo "SUCCESS: Applied using three-way merge."
                applied=$((applied + 1))
                echo "- STATUS: APPLIED (3-way)" >> "$REPORT"
                continue
              else
                echo "ERROR: Three-way application failed."
              fi

            else
              echo "WARNING: Three-way validation failed."
            fi

            echo ""
            echo "[4/5] Trying whitespace-tolerant application..."

            if run_cmd "Whitespace-tolerant validation" git apply --check --ignore-space-change --ignore-whitespace "$p"; then

              if run_cmd "Applying whitespace-tolerant patch" git apply --verbose --ignore-space-change --ignore-whitespace "$p"; then
                echo "SUCCESS: Applied using whitespace tolerance."
                applied=$((applied + 1))
                echo "- STATUS: APPLIED (WHITESPACE FALLBACK)" >> "$REPORT"
                continue
              else
                echo "ERROR: Whitespace-tolerant application failed."
              fi

            else
              echo "ERROR: Whitespace-tolerant validation failed."
            fi

            echo ""
            echo "[5/5] Collecting failure diagnostics..."

            run_cmd "Normal patch validation" git apply --check --verbose "$p" || true

            run_cmd "Current working tree" git status --short || true

            run_cmd "Whitespace diagnostics" git diff --check || true

            run_cmd "Patch file information" git apply --numstat "$p" || true

            echo "FAILED: $p"
            failed=$((failed + 1))

            echo "- STATUS: FAILED" >> "$REPORT"
            echo "- DIAGNOSTICS: $log" >> "$REPORT"

            echo "WARNING: Continuing with remaining patches."
          done

          echo ""
          echo "=================================================="
          echo "             PATCH SUMMARY"
          echo "=================================================="

          echo "Total patches:   $total"
          echo "Successfully applied: $applied"
          echo "Already applied:      $already"
          echo "Failed patches:       $failed"

          echo ""
          echo "Final working tree:"
          git status --short

          {
            echo ""
            echo "## Summary"
            echo ""
            echo "| Result | Count |"
            echo "|---|---:|"
            echo "| Total | $total |"
            echo "| Applied | $applied |"
            echo "| Already applied | $already |"
            echo "| Failed | $failed |"
            echo ""
          } >> "$REPORT"

          {
            echo "## Patch processing"
            echo ""
            echo "- Total: $total"
            echo "- Applied: $applied"
            echo "- Already applied: $already"
            echo "- Failed: $failed"
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "Patch processing completed."
          echo "Detailed logs: patch-logs/"
          echo "Report: patch-report.md"

          echo "PATCH_TOTAL=$total" >> "$GITHUB_OUTPUT"
          echo "PATCH_APPLIED=$applied" >> "$GITHUB_OUTPUT"
          echo "PATCH_ALREADY=$already" >> "$GITHUB_OUTPUT"
          echo "PATCH_FAILED=$failed" >> "$GITHUB_OUTPUT"

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: '12.4.0'

      - name: Initialize MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1 # Sets up required environment variables and compiler paths for MSVC

      - name: Configure CMake for Windows CUDA Shared Libraries
        shell: pwsh
        run: |
          mkdir build
          cd build
          
          # CMake will now automatically detect MSVC and the CUDA toolkit via environment variables
          cmake .. `
            -DGGML_CUDA=ON `
            -DGGML_NATIVE=OFF `
            -DGGML_BACKEND_DL=ON `
            -DGGML_CPU_ALL_VARIANTS=ON `
            -DGGML_AVX512=OFF `
            -DGGML_AVX512_VBMI=OFF `
            -DGGML_AVX512_VNNI=OFF `
            -DGGML_AVX512_BF16=OFF `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Everything
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Bundle DLLs, EXEs, and NVIDIA Runtimes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path final-release
          Get-ChildItem -Path build -Recurse -Filter "*.exe" | Copy-Item -Destination final-release -Force
          Get-ChildItem -Path build -Recurse -Filter "*.dll" | Copy-Item -Destination final-release -Force

      - name: Upload Windows Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-windows-cuda-shared-dlls
          path: final-release/*
